name: CI

# 每次 push / PR 都跑。此前仓库里只有 release.yml，它**只在推 v* 标签时触发**——
# 也就是说 main 上的回归要一直躺到发版那天才会被发现，而那时通常正赶时间。
on:
  push:
    branches: ['**']
  pull_request:

# 同一分支上新的 push 取消尚未跑完的旧任务，省 runner 也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 网络韧性：与 release.yml 保持一致
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # ---------------------------------------------------------------- 测试 + lint
  # 这个 job 是唯一应该设成「必须通过」的：它跑全部单元/回归测试。
  test:
    name: test + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 仓库根的 .cargo/config.toml 指向国内 rsproxy 镜像（为中国网络加速），
      # 在 GitHub 的海外 runner 上它反而慢且不稳。见 BUILD.md。
      - name: Use upstream crates.io
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config

      # 默认 features 下的全部测试。live SFTP 那组是 #[ignore] 的（需要真实 sshd），
      # 这里不会跑到——跑法见 scripts/test-live-sftp.sh。
      - name: cargo test
        run: cargo test --all-targets

      # 刻意**不加** `-D warnings`：仓库里有十几个历史遗留警告（未用导入、参数过多等），
      # 一上来就 deny 会让这个 job 从第一天起就是红的，接着就没人看它了。
      # 想收紧的话，正确顺序是先单独提一个「清掉存量警告」的提交，再回来加 -D warnings。
      - name: cargo clippy
        run: cargo clippy --all-targets

  # ------------------------------------------------------- 交叉编译（只 check，不产物）
  # release.yml 只在打标签时才碰 Windows/macOS/arm，于是 `#[cfg(windows)]` /
  # `#[cfg(not(unix))]` 这些分支在平时**根本不会被编译**——改坏了要等到发版当天才炸，
  # 而那条流水线一挂就是整个 release 卡住。这里每次 push 都过一遍编译器。
  #
  # 只 `cargo check`（不 build、不链接）：目的是"这些 cfg 分支还能编译吗"，
  # 几十秒就能回答，不需要真产出二进制。
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu }
          - { os: macos-14,     target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Use upstream crates.io
        shell: bash
        run: rm -f .cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux 上交叉到 arm64 需要目标平台的 C 交叉工具链（ring 等要编 C）
      - name: Cross toolchain (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libxkbcommon-dev libwayland-dev pkg-config
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # ishell-mcp 只在 Unix 有意义（依赖 Unix domain socket），Windows 上是个总是报错的桩，
      # 但**桩本身也必须能编译**，所以 --all-targets 照样带上它。
      - name: cargo check
        run: cargo check --target ${{ matrix.target }} --all-targets
